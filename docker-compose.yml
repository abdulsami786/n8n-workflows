# LeadOps · n8n + Postgres (+ optional Caddy for HTTPS)
#   docker compose up -d                     -> n8n on http://127.0.0.1:5678
#   docker compose --profile https up -d     -> also HTTPS on N8N_DOMAIN (needed for Meta webhooks)
services:
  postgres:
    image: postgres:17-alpine          # n8n 2.x only gives Postgres 16 "compatibility support"
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: n8n
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d n8n"]
      interval: 5s
      retries: 20

  n8n:
    image: n8nio/n8n:2.41.3            # version the workflows were tested on
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file: .env
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_DATABASE: n8n
      DB_POSTGRESDB_USER: ${POSTGRES_USER}
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD}
      N8N_WEBHOOK_URL: ${PUBLIC_BASE_URL}/
      N8N_EDITOR_BASE_URL: ${PUBLIC_BASE_URL}/
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"   # workflows read their config from .env
      GENERIC_TIMEZONE: ${TIMEZONE}
      TZ: ${TIMEZONE}
      N8N_PROXY_HOPS: "1"
      EXECUTIONS_DATA_PRUNE: "true"
      EXECUTIONS_DATA_MAX_AGE: "336"          # keep 14 days of execution history
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"
    ports:
      - "127.0.0.1:5678:5678"
    volumes:
      - n8n_data:/home/node/.n8n
      - ./n8n:/import:ro

  caddy:
    image: caddy:2-alpine
    profiles: ["https"]
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    environment:
      N8N_DOMAIN: ${N8N_DOMAIN}
    command: caddy reverse-proxy --from ${N8N_DOMAIN} --to n8n:5678
    volumes:
      - caddy_data:/data

volumes:
  pg_data:
  n8n_data:
  caddy_data:
